{ { - if .Values.geyser.enabled } }
apiVersion: apps/v1
kind: Deployment
metadata:
    name: cryon-geyser
    namespace: { { .Values.namespace } }
    labels:
        app.kubernetes.io/name: cryon
        app.kubernetes.io/component: geyser
spec:
    replicas: { { .Values.geyser.replicas } }
    selector:
        matchLabels:
            app.kubernetes.io/component: geyser
    template:
        metadata:
            labels:
                app.kubernetes.io/name: cryon
                app.kubernetes.io/component: geyser
        spec:
            containers:
                -   name: geyser
                    image: { { .Values.image.geyser } }
                    imagePullPolicy: { { .Values.image.pullPolicy } }
                    ports:
                        -   name: bedrock
                            containerPort: 19132
                            protocol: UDP
                    env:
                        -   name: CRYON_DB_PASSWORD
                            valueFrom:
                                secretKeyRef:
                                    name: { { .Values.secrets.postgres } }
                                    key: password
                    volumeMounts:
                        -   name: geyser-config
                            mountPath: /geyser-config
                            readOnly: true
                        -   name: cryon-config
                            mountPath: /cryon-config
                            readOnly: true
                        -   name: floodgate
                            mountPath: /floodgate
                            readOnly: true
            volumes:
                -   name: geyser-config
                    configMap:
                        name: cryon-geyser-config
                        items:
                            -   key: config.yml
                                path: config.yml
                # The same ConfigMap mounted a second time, so the extension config lands on the path
                # the entrypoint expects. /cryon-config is what the proxy image uses too.
                -   name: cryon-config
                    configMap:
                        name: cryon-geyser-config
                        items:
                            -   key: cryon-config.yml
                                path: config.yml
                -   name: floodgate
                    secret:
                        secretName: { { .Values.secrets.floodgate } }
  { { - end } }
