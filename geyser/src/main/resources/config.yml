# Set false on a development deployment. Controls the default for the module hot-reload watcher
# (see modules.auto-reload). Does not affect the /cryon load|unload|scan|reload-api commands, which
# always work.
production: true

modules:
# Watch modules/ and automatically load, reload, and unload feature jars at runtime as they are
# added, replaced, or deleted. Intended for dev iteration. Defaults to the opposite of
# `production`; uncomment to override. Feature jars are loaded from private copies, so the
# originals here are never locked and can be freely swapped while running.
#auto-reload: true

# Cryon Geyser extension config.
#
# Geyser Standalone runs beside the network rather than inside it, so this loader takes the shared
# state it needs to answer a Bedrock client at its own edge: maintenance (so a login is refused here
# with a Bedrock disconnect screen instead of a Java-shaped kick from the proxy) and the server
# registry (read-only; Geyser registers no node of its own and routes no player).
#
# With redis off none of that crosses processes, so maintenance toggled here is local to this Geyser
# and the registry is empty. That is fine for a single-machine setup where the proxy is the only
# thing enforcing maintenance anyway.
#
# The database is optional; without it, maintenance state resets when Geyser restarts.

database:
    enabled: false
    # Backend: postgresql, mysql, or h2. With h2 the DB is an embedded local file (`database` below is
    # its path, host/port ignored), which is local to this process and shared with nothing.
    type: postgresql
    host: localhost
    # Leave the port at the backend default (postgresql 5432, mysql 3306) or set your own.
    port: 5432
    database: cryon
    username: cryon
    password: ""
    max-pool-size: 10

redis:
    enabled: false
    # redis://[:password@]host:port/db
    uri: "redis://localhost:6379/0"

network:
    registry-enabled: true
    heartbeat-seconds: 5

# Network-wide maintenance mode, the same state the proxies hold. Toggle with /maintenance on|off
# [message] (permission cryon.maintenance); with redis on it syncs to every proxy and every Geyser.
# While on, a Bedrock login is denied here unless the player is on the /maintenance allowlist. The
# cryon.maintenance.bypass permission is NOT evaluated at this point (there is no permission backend
# for a player who has not connected yet); the proxy still enforces it a moment later.
maintenance:
    default-message: "The network is under maintenance."
    # How often to re-pull maintenance state from the database, in seconds. A broadcast only reaches a
    # process that was listening, so this is what repairs a process that started before the database
    # was reachable, or that missed a toggle while disconnected. 0 disables it. Needs database.enabled.
    refresh-seconds: 30

# Bedrock server-list MOTD (shown when maintenance is off). Same keys as the proxy config so one set
# of copy serves both, but a Bedrock ping is two plain strings with no font metrics, so the left /
# center / right segments of a line are simply joined with a space rather than pixel-aligned, and
# `width` is not read. The bottom line lands in the ping's secondary slot, which only some Bedrock
# clients show, so keep the identity on top. Reload at runtime with /motd reload (permission
# cryon.motd) after editing this section.
motd:
    enabled: true
    top:
        left: "<gradient:#09add3:#5ce1e6><bold>Cryon Network"
        center: ""
        right: ""
    bottom:
        left: "<off_white>Welcome back!"
        center: ""
        right: ""

# GitOps delivery. Off by default. When on, this server polls a git repository and lays its contents
# down where the loaders already look: config.yml, the lang overrides, per-module configs, and
# module jars. Which files it takes is decided by deploy.folder below.
#
# What happens next is deliberately NOT decided here. A jar written into modules/ hot-swaps when
# modules.auto-reload is on and waits for a restart when it is not, exactly as if an operator had
# dropped it in; a second switch letting a commit apply where a local change could not would be a
# surprise nobody asked for. config.yml is the one exception and is re-read immediately, because
# nothing was watching it before.
#
# Nothing is ever deleted. A file removed from the repository stays on this disk, so a bad merge
# cannot empty a server.
deploy:
    enabled: false
    # git's own smart-HTTP advertisement: the clone URL plus this suffix. Every forge serves it, and
    # it returns a few kilobytes, so polling costs almost nothing.
    refs-url: "https://github.com/your-org/cryon-deploy.git/info/refs?service=git-upload-pack"
    # The zip archive, with {ref} where the commit goes. Zip rather than tar because the JDK reads
    # zip and has no tar reader. GitHub is shown; GitLab is
    # https://gitlab.com/org/repo/-/archive/{ref}/repo-{ref}.zip and Gitea
    # https://gitea.example.com/org/repo/archive/{ref}.zip
    archive-url: "https://codeload.github.com/your-org/cryon-deploy/zip/{ref}"
    # The branch to deploy from, as a bare name. Anything already starting with refs/ is taken
    # verbatim, which is how you pin a server to a tag: refs/tags/v1.4.0
    #
    # A branch this repository does not have is NOT an error. It falls back, in order, to the
    # repository's own default branch (whatever HEAD points at, which is the only place that is
    # actually stated), then main, then master. So deleting a merged feature branch returns the
    # servers following it to the trunk instead of freezing them on its last commit.
    branch: "main"
    poll-seconds: 60
    timeout-seconds: 30
    # Prefer CRYON_DEPLOY_USERNAME and CRYON_DEPLOY_PASSWORD (a personal access token goes in the
    # password). These exist for a local test network where there is no secret worth protecting;
    # config.yml is the file most likely to get pasted into a support channel.
    username: ""
    password: ""
    # The directory in the repository holding this server's files. One repository can then carry
    # geyser/, velocity/, lifesteal8/ side by side, and a file only ever reaches the server whose
    # folder it sits in.
    #
    # {server} resolves to this node's pool name (network.server), which is the right default for a
    # pool of interchangeable nodes. Name it explicitly when the folder is not called after the pool.
    folder: "{server}"
    # Where each kind of thing lives INSIDE that folder. Blank turns that one off.
    #
    # data/ mirrors plugins/Cryon/data/<module-id>/, so a server folder holds only the module configs
    # it actually changes. A module the folder does not carry is not overridden at all: it extracts
    # the default bundled in its own jar, exactly as it would with no deploy configured.
    #
    #   lifesteal8/
    #       config.yml
    #       lang/en_US.properties
    #       data/cryon-economy/config.yml
    #       modules/cryon-economy.jar
    paths:
        config: "config.yml"
        lang: "lang"
        modules: "modules"
        data: "data"

