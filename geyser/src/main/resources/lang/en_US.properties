# Cryon Geyser loader messages. MiniMessage templates; palette tags resolve through Mini.
# Admins can override any key by dropping a lang/<locale>.properties into the extension data folder.
cryon.geyser.maintenance.usage=<off_white>Usage: <highlight>/maintenance <on|off|add|remove|list> [args]
cryon.geyser.maintenance.enabled=<success>Maintenance enabled.
cryon.geyser.maintenance.disabled=<success>Maintenance disabled.
cryon.geyser.maintenance.allow.added=<success>Added <highlight><player></highlight> to the maintenance allowlist.
cryon.geyser.maintenance.allow.already=<warn><highlight><player></highlight> is already on the allowlist.
cryon.geyser.maintenance.allow.removed=<success>Removed <highlight><player></highlight> from the maintenance allowlist.
cryon.geyser.maintenance.allow.absent=<warn><highlight><player></highlight> was not on the allowlist.
cryon.geyser.maintenance.allow.empty=<off_white>The maintenance allowlist is empty.
cryon.geyser.maintenance.allow.list=<off_white>Maintenance allowlist (<highlight><count></highlight>): <highlight><players>
cryon.geyser.motd.usage=<off_white>Usage: <highlight>/motd reload
cryon.geyser.motd.reloaded=<success>Bedrock MOTD reloaded from config.
cryon.common.prefix=
cryon.common.no_permission=<off_white>You do not have access to this command.
cryon.common.not_online=<highlight_blue><name></highlight_blue> <off_white>is not online!
