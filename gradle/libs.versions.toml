[versions]
adventure = "4.17.0"

h2 = "2.3.232"
mysql = "9.7.0"
hikaricp = "5.1.0"
postgresql = "42.7.13"

kotlin = "2.4.20-Beta1"

slf4j = "2.0.16"
snakeyaml = "2.2"
caffeine = "3.1.8"
lettuce = "6.7.1.RELEASE"

shadow = "9.4.2"
runPaper = "3.0.2"
paperweight = "2.0.0-beta.21"

# Three separate coordinates on purpose: :paper builds against the 26.2 dev bundle, run-paper starts a
# 26.2 server, and :paper-api compiles against the plain paper-api artifact. The last two share a range
# but are different artifacts. Paper dropped the -R0.1-SNAPSHOT scheme at 26.x, so both track builds.
minecraft = "26.2"
paperDevBundle = "26.2.build.+"
paper = "26.2.build.+"

placeholderapi = "2.11.6"
velocity = "3.3.0-SNAPSHOT"

invui = "2.2.0"
floodgate = "2.2.4-SNAPSHOT"

[libraries]
h2 = { module = "com.h2database:h2", version.ref = "h2" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
mysql = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }

invui = { module = "xyz.xenondevs.invui:invui", version.ref = "invui" }
floodgate = { module = "org.geysermc.floodgate:api", version.ref = "floodgate" }

slf4j = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
lettuce = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }

kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }

adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-legacy = { module = "net.kyori:adventure-text-serializer-legacy", version.ref = "adventure" }

gradle-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[bundles]
sql = ["h2", "hikaricp", "mysql", "postgresql"]
adventure = ["adventure-api", "adventure-minimessage", "adventure-legacy"]

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
runPaper = { id = "xyz.jpenilla.run-paper", version.ref = "runPaper" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
paperweight = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
