cryon.velocity.server.no_access=<off_white>You do not have access to <highlight><server></highlight>.
cryon.velocity.motd.usage=<off_white>Usage: <highlight>/motd reload
cryon.velocity.motd.reloaded=<success>MOTD reloaded from config.
