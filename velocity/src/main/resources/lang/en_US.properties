# Cryon proxy (Velocity) messages. MiniMessage templates; palette tags resolve through Mini.
# Admins can override any key by dropping a lang/<locale>.properties into plugins/cryon/lang/.
cryon.velocity.maintenance.usage=<off_white>Usage: <highlight>/maintenance <on|off|add|remove|list> [args]
cryon.velocity.maintenance.enabled=<success>Maintenance enabled.
cryon.velocity.maintenance.disabled=<success>Maintenance disabled.
cryon.velocity.maintenance.allow.added=<success>Added <highlight><player></highlight> to the maintenance allowlist.
cryon.velocity.maintenance.allow.already=<warn><highlight><player></highlight> is already on the allowlist.
cryon.velocity.maintenance.allow.removed=<success>Removed <highlight><player></highlight> from the maintenance allowlist.
cryon.velocity.maintenance.allow.absent=<warn><highlight><player></highlight> was not on the allowlist.
cryon.velocity.maintenance.allow.empty=<off_white>The maintenance allowlist is empty.
cryon.velocity.maintenance.allow.list=<off_white>Maintenance allowlist (<highlight><count></highlight>): <highlight><players>
